<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrailMark — Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #0e1210;
      --surface: #151c17;
      --surface2: #1c2620;
      --border: #263029;
      --green: #3d6b4f;
      --green-l: #4e8963;
      --amber: #c9943a;
      --amber-l: #e0a840;
      --text: #dfe8e0;
      --muted: #7a9180;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--amber);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .logo i { color: var(--green-l); }
    .tagline { font-size: .85rem; color: var(--muted); margin-bottom: 32px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
    }
    .tabs {
      display: flex;
      background: var(--surface2);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      padding: 9px;
      border: none;
      background: none;
      border-radius: 7px;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .tab.active {
      background: var(--green);
      color: #fff;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    label {
      font-size: .72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: .9rem;
      width: 100%;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--green-l); }
    input::placeholder { color: var(--muted); }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--amber);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: background .2s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover { background: var(--amber-l); }
    .btn-submit:active { transform: scale(.98); }
    .btn-submit:disabled { opacity: .6; cursor: default; }
    .error-msg {
      background: rgba(196,69,54,.15);
      border: 1px solid rgba(196,69,54,.35);
      color: #e8776a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .83rem;
      margin-bottom: 14px;
      display: none;
    }
    .error-msg.show { display: block; }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
      color: var(--muted);
      font-size: .75rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .footer-note {
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
      margin-top: 20px;
      line-height: 1.5;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="logo"><i class="fa-solid fa-crosshairs"></i> TrailMark</div>
<p class="tagline">Your daily hunting companion</p>

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Sign In</button>
    <button class="tab" onclick="switchTab('register')">Create Account</button>
  </div>

  <div id="error-msg" class="error-msg"></div>

  <!-- LOGIN PANEL -->
  <div id="panel-login" class="panel active">
    <div class="form-group">
      <label>Username or Email</label>
      <input type="text" id="login-login" placeholder="jake_mercer" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-submit" id="btn-login" onclick="doLogin()">
      <span class="spinner" id="spinner-login"></span>
      <span>Sign In</span>
    </button>
  </div>

  <!-- REGISTER PANEL -->
  <div id="panel-register" class="panel">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="reg-username" placeholder="jake_mercer" autocomplete="username" maxlength="30">
    </div>
    <div class="form-group">
      <label>Display Name</label>
      <input type="text" id="reg-display" placeholder="Jake Mercer" autocomplete="name">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="jake@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password <span style="color:var(--muted);text-transform:none;letter-spacing:0">(min 8 chars)</span></label>
      <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn-submit" id="btn-register" onclick="doRegister()">
      <span class="spinner" id="spinner-register"></span>
      <span>Create Account</span>
    </button>
  </div>
</div>

<p class="footer-note">By signing up you agree to hunt responsibly<br>and follow all local regulations.</p>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'login')));
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-register').classList.toggle('active', tab === 'register');
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    document.getElementById('error-msg').classList.remove('show');
  }

  function setLoading(btnId, spinnerId, loading) {
    document.getElementById(btnId).disabled = loading;
    document.getElementById(spinnerId).style.display = loading ? 'block' : 'none';
  }

  async function doLogin() {
    hideError();
    const login = document.getElementById('login-login').value.trim();
    const password = document.getElementById('login-password').value;
    if (!login || !password) return showError('Please fill in all fields.');

    setLoading('btn-login', 'spinner-login', true);
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password }),
      });
      const data = await r.json();
      if (!r.ok) return showError(data.error || 'Login failed.');
      window.location.href = '/';
    } catch {
      showError('Network error — please try again.');
    } finally {
      setLoading('btn-login', 'spinner-login', false);
    }
  }

  async function doRegister() {
    hideError();
    const username = document.getElementById('reg-username').value.trim();
    const display_name = document.getElementById('reg-display').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!username || !email || !password) return showError('Please fill in all required fields.');

    setLoading('btn-register', 'spinner-register', true);
    try {
      const r = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, display_name, email, password }),
      });
      const data = await r.json();
      if (!r.ok) return showError(data.error || 'Registration failed.');
      window.location.href = '/';
    } catch {
      showError('Network error — please try again.');
    } finally {
      setLoading('btn-register', 'spinner-register', false);
    }
  }

  // Allow Enter key submission
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('panel-login').classList.contains('active')) doLogin();
    else doRegister();
  });

  // If already logged in, skip to app
  fetch('/api/auth/me').then(r => { if (r.ok) window.location.href = '/'; });
</script>
</body>
</html>
